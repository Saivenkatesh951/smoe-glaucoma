[project]
name = "smoe-glaucoma"
version = "0.1.0"
description = "Balanced Soft Mixture-of-Experts and balanced multi-modal baselines for glaucoma detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
# Versions used for the paper's experiments
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "timm==1.0.9",
    "huggingface-hub==0.24.7",  # timm downloads the ImageNet ViT-B weights from the Hub
    "numpy==2.1.1",
    "scikit-learn==1.5.2",
    "scikit-image==0.24.0",
    "fairlearn==0.10.0",
]

[tool.uv]
package = false
